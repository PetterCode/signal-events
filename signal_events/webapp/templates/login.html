<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>Logga in — Signalhändelser</title>
  <style>
    body {
      font-family: -apple-system, Helvetica, Arial, sans-serif; margin: 0; background: #f5f5f5;
      color: #1a1a1a; display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .login-card {
      background: #fff; padding: 2rem; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      width: 100%; max-width: 320px;
    }
    .login-card h1 { font-size: 1.3rem; margin: 0 0 0.25rem; color: #1a2733; }
    .login-card p.subtitle { font-size: 0.85rem; color: #666; margin: 0 0 1.25rem; }
    label { display: block; margin-top: 0.75rem; font-size: 0.85rem; font-weight: 600; color: #333; }
    input[type=text], input[type=password] {
      width: 100%; padding: 0.4rem; margin-top: 0.2rem; box-sizing: border-box; font-size: 0.9rem;
    }
    .actions { margin-top: 1.25rem; }
    button {
      background: #1a2733; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 4px;
      cursor: pointer; font-size: 0.9rem; width: 100%;
    }
    .error { background: #f8d7d7; color: #7a1e1e; padding: 0.6rem 0.8rem; border-radius: 4px; font-size: 0.85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Signalhändelser</h1>
    <p class="subtitle">Logga in med det konto du fått av enhetens administratör.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="name">Namn</label>
      <input type="text" id="name" name="name" autofocus required>
      <label for="password">Lösenord</label>
      <input type="password" id="password" name="password" required>
      <div class="actions">
        <button type="submit">Logga in</button>
      </div>
    </form>
  </div>
</body>
</html>
